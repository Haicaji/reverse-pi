# Reverse Pi shared configuration.
#
# These are the tool paths and service settings used by the bundled skills.
# Scripts read these values only from this file; environment variables are not
# consulted. Values absent here fall back to the defaults in each skill's
# scripts/config.sh.
#
# Path values may start with "~/" (expanded to $HOME).
#
# Ports are also referenced by .pi/mcp.json; update that file when you change
# a port here.

[jadx]
# MCP server port and the JADX-GUI MCP plugin port.
port = 8651
jadx_port = 8650

# jadx_mcp_server.py and the JADX-GUI launcher.
mcp_server = "~/MCPServer/jadx-mcp-server/jadx_mcp_server.py"
gui = "~/Program/jadx-1.5.6/bin/jadx-gui"

# Python interpreter used to run the MCP server.
# Unset means python3 from PATH.
# python = "/usr/bin/python3"

# Seconds to wait for the JADX-GUI plugin port after launch.
gui_start_timeout = 240

# Directory for JADX MCP logs and PID files.
state_dir = "~/.local/state/jadx-mcp"

# Space-separated variables that must never be removed when scrubbing
# snap-injected paths from the JADX-GUI environment.
gui_env_keep = ""

[ghidra]
# Ghidra installation and the ghidra-mcp checkout.
home = "~/Program/ghidra_12.1.3"
mcp_dir = "~/MCPServer/ghidra-mcp"

# Ghidra headless server bind address and port.
host = "127.0.0.1"
port = 8089

# MCP bridge bind address and port.
mcp_host = "0.0.0.0"
mcp_port = 13337

# Python interpreter used to run the MCP bridge.
# Unset means python3 from PATH.
# python = "/usr/bin/python3"

[idalib]
# IDAlib MCP server port.
port = 13336
